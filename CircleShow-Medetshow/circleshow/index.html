<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кружочек SHOW • Live</title><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;color:#fff;font:16px system-ui;background:radial-gradient(ellipse at 50% 40%,#25204b,#090b19 65%);display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;gap:16px}h1{margin:0;letter-spacing:.2em;font-size:clamp(20px,3vw,42px)}small{color:#b5b0d0}#qr{background:white;padding:8px;border-radius:10px}#qr:empty{display:none}#wall{flex:1;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px;padding:10px 24px} .clip{position:relative;border-radius:50%;overflow:hidden;border:3px solid #a995ff;box-shadow:0 0 18px #7962f44d;background:#17152c;animation:appear .35s ease-out;cursor:pointer;flex:none}.clip video{width:100%;height:100%;object-fit:cover}.clip button{position:absolute;top:12%;right:12%;display:none}.clip:hover button{display:block}@keyframes appear{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}footer{padding:12px 28px;display:flex;justify-content:space-between;color:#c3bed8}button,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #57516e}button{background:#30264e;color:white;cursor:pointer}input{background:#151529;color:white}dialog{background:#17152b;color:white;border:1px solid #62547d;border-radius:18px;max-width:90vw}dialog::backdrop{background:#060711cc}#winner video{width:min(65vh,75vw);aspect-ratio:1;object-fit:cover;border-radius:50%;border:5px solid #ffd77c}#winner{text-align:center}#empty{text-align:center;color:#a8a4c1;margin:auto}#status{color:#ffce83;white-space:pre-wrap}#login input{display:block;margin:10px 0;width:100%}
</style></head><body><header><div><h1>◉ КРУЖОЧЕК SHOW</h1><small>Сканируй. Записывай. Побеждай.</small></div><div id="qr"></div></header><main id="wall"><div id="empty">Ожидаем видеокружочки гостей</div></main><footer><span id="count">0 / 50</span><span id="status"></span><button id="settings">⚙ F2</button></footer><dialog id="login"><h2>Вход ведущего</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="signin">Войти</button><p id="loginError"></p></dialog><dialog id="controls"><h2>Управление игрой</h2><button id="newGame">Новая игра</button> <button id="pause">Остановить приём</button> <button id="end">Завершить</button> <button id="full">Полный экран</button> <button id="close">Закрыть</button><p>Нажмите на кружочек для выбора победителя. Наведите курсор для удаления.</p></dialog><dialog id="winner"><h2>★ ПОБЕДИТЕЛЬ ★</h2><video id="winning" controls playsinline loop></video><p><button id="back">Вернуться к игре</button></p></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="config.js"></script><script>
let room=null, busy=false, accepting=true, clips=new Map(); const wall=$('wall');
function status(s){$('status').textContent=s} function layout(){const n=clips.size; $('count').textContent=n+' / 50';$('empty').hidden=!!n;if(!n)return;let best=0;for(let c=1;c<=n;c++){let rows=Math.ceil(n/c);best=Math.max(best,Math.min((wall.clientWidth-48-(c-1)*10)/c,(wall.clientHeight-20-(rows-1)*10)/rows));}for(const {el} of clips.values())el.style.width=el.style.height=Math.max(1,Math.floor(best)-2)+'px';}new ResizeObserver(layout).observe(wall);
function removeLocal(id){const x=clips.get(id);if(!x)return;x.el.querySelector('video').pause();x.el.remove();URL.revokeObjectURL(x.url);clips.delete(id);layout()}
function setRoom(r){room=r;for(const id of [...clips.keys()])removeLocal(id);$('qr').replaceChildren();if(r){const u=new URL('join.html',location.href);u.searchParams.set('room',r);new QRCode($('qr'),{text:u.href,width:250,height:250,correctLevel:QRCode.CorrectLevel.M});}layout()}
async function refresh(){if(!room||busy)return;busy=true;const r=room;try{const list=await rpc('cs_list',{r});if(r!==room)return;for(const id of [...clips.keys()])if(!list.some(x=>x.id===id))removeLocal(id);for(const item of list){if(clips.has(item.id))continue;const payload=await rpc('cs_video',{v:item.id});if(r!==room)return;if(!payload)continue;const bytes=Uint8Array.from(atob(payload),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:item.mime}));const el=document.createElement('div');el.className='clip';const video=document.createElement('video');video.src=url;video.muted=true;video.loop=true;video.autoplay=true;video.playsInline=true;el.append(video);const del=document.createElement('button');del.textContent='×';del.onclick=async e=>{e.stopPropagation();if(confirm('Удалить видео?')){try{await rpc('cs_remove',{v:item.id});removeLocal(item.id)}catch(e){status(e.message)}}};el.append(del);el.onclick=()=>{$('winning').src=url;$('winner').showModal();$('winning').play().catch(()=>{});for(const x of clips.values())x.el.querySelector('video').pause()};wall.append(el);clips.set(item.id,{el,url});layout();video.play().catch(()=>{});} status('');}catch(e){status(e.message)}finally{busy=false}}
async function init(){try{setRoom(await rpc('cs_current'));if(room){accepting=await rpc('cs_open',{r:room});$('pause').textContent=accepting?'Остановить приём':'Возобновить приём';}else $('controls').showModal();refresh()}catch(e){status(e.message)}}
$('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginError').textContent=error.message;return}$('login').close();init()};db.auth.getSession().then(({data})=>{if(data.session)init();else $('login').showModal()});
$('settings').onclick=()=>{if(!$('controls').open)$('controls').showModal()};addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();if($('controls').open)$('controls').close();else if(!$('login').open&&!$('winner').open)$('controls').showModal()}});
$('close').onclick=()=>$('controls').close();$('full').onclick=()=>{document.documentElement.requestFullscreen?.().catch(e=>status(e.message));$('controls').close()};
$('newGame').onclick=async()=>{if(room&&!confirm('Удалить старую игру и все видео?'))return;try{setRoom(await rpc('cs_new'));accepting=true;$('pause').textContent='Остановить приём';$('controls').close();refresh()}catch(e){status(e.message)}};
$('pause').onclick=async()=>{if(!room)return;try{await rpc('cs_accept',{r:room,a:!accepting});accepting=!accepting;$('pause').textContent=accepting?'Остановить приём':'Возобновить приём'}catch(e){status(e.message)}};
$('end').onclick=async()=>{if(room&&confirm('Удалить все видео?'))try{await rpc('cs_end',{r:room});setRoom(null);$('controls').close()}catch(e){status(e.message)}};
$('back').onclick=()=>$('winner').close();$('winner').onclose=()=>{$('winning').pause();$('winning').removeAttribute('src');$('winning').load();for(const x of clips.values())x.el.querySelector('video').play().catch(()=>{})};setInterval(refresh,2000);
</script></body></html>
