<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кружочек SHOW • Запись</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 15%,#302454,#090b19 65%);color:white;font:16px system-ui}main{text-align:center;width:min(100%,440px);padding:24px}h1{letter-spacing:.16em;font-size:26px}p{color:#c3bed8;line-height:1.5}#circle{width:min(78vw,310px);aspect-ratio:1;margin:24px auto;border-radius:50%;overflow:hidden;border:3px solid #a995ff;box-shadow:0 0 35px #8c65ef55;background:#18152b;position:relative;display:grid;place-items:center}video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}button{font:inherit;color:white;background:#7650d8;border:0;border-radius:14px;padding:14px 20px;margin:5px;cursor:pointer}button:disabled{opacity:.4}#record{background:#e84b65}#timer{font-variant-numeric:tabular-nums;font-size:24px}#message{min-height:48px}small{color:#bcb6d5} [hidden]{display:none!important}</style></head><body><main><h1>◉ КРУЖОЧЕК SHOW</h1><h2>Твой момент на экране</h2><p>Запиши видео до 10 секунд и стань частью шоу.</p><div id="circle"><span id="placeholder">Камера выключена</span><video id="preview" playsinline muted hidden></video></div><div id="timer">00:10</div><button id="camera" disabled>Включить камеру</button><button id="flip" hidden>↻ Камера</button><button id="record" hidden>● Записать</button><button id="retry" hidden>Перезаписать</button><button id="send" hidden>Отправить на экран</button><p id="message" role="status">Проверяем игровую комнату…</p><small>Отправляя видео, вы соглашаетесь на показ изображения и звука на мероприятии. Записи удаляются после игры или при автоочистке через 24 часа.</small></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const room=new URLSearchParams(location.search).get('room');let stream,rec,blob,token,previewUrl,tick,stopTimer,facing='user';const preview=$('preview'); const message=s=>$('message').textContent=s;const show=(id,b)=>$(id).hidden=!b;
async function check(){try{if(!room||!await rpc('cs_open',{r:room}))throw Error('Игра закрыта или QR-код устарел.');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Откройте ссылку в Safari или Chrome через HTTPS.');$('camera').disabled=false;message('Разрешите доступ к камере и микрофону.')}catch(e){message(e.message)}}
function release(){stream?.getTracks().forEach(t=>t.stop());stream=null;preview.srcObject=null}function clearPreview(){preview.pause();preview.removeAttribute('src');if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;blob=null;preview.load()}
async function camera(){try{release();clearPreview();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:480},height:{ideal:480},frameRate:{ideal:24,max:30}},audio:true});preview.srcObject=stream;preview.muted=true;preview.controls=false;show('preview',true);show('placeholder',false);await preview.play();show('camera',false);show('flip',true);show('record',true);$('record').textContent='● Записать';show('retry',false);show('send',false);$('timer').textContent='00:10';message('Готово к записи.')}catch(e){release();show('camera',true);show('record',false);show('flip',false);message('Не удалось открыть камеру: '+e.message)}}
$('camera').onclick=camera;$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';camera()};$('retry').onclick=camera;
$('record').onclick=()=>{if(rec?.state==='recording'){rec.stop();return}try{let chunks=[];const types=['video/mp4','video/webm;codecs=vp8,opus','video/webm'];const mimeType=types.find(t=>MediaRecorder.isTypeSupported(t));if(!mimeType)throw Error('Формат записи не поддерживается браузером.');rec=new MediaRecorder(stream,{mimeType,videoBitsPerSecond:450000,audioBitsPerSecond:48000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onerror=e=>{clearInterval(tick);clearTimeout(stopTimer);release();show('record',false);show('camera',true);message(e.error?.message||'Ошибка записи')};rec.onstop=()=>{clearInterval(tick);clearTimeout(stopTimer);blob=new Blob(chunks,{type:rec.mimeType.split(';')[0]});token=crypto.randomUUID();release();previewUrl=URL.createObjectURL(blob);preview.src=previewUrl;preview.controls=true;preview.muted=false;preview.loop=true;show('record',false);show('retry',true);show('send',true);$('send').disabled=blob.size>1200000||!blob.size;message($('send').disabled?'Видео слишком большое или пустое. Запишите более короткое.':'Проверьте видео и отправьте его на экран.');preview.play().catch(()=>{})};rec.start();show('flip',false);$('record').textContent='■ Стоп';let start=performance.now();tick=setInterval(()=>{$('timer').textContent='00:'+String(Math.max(0,10-Math.floor((performance.now()-start)/1000))).padStart(2,'0')},200);stopTimer=setTimeout(()=>{if(rec.state==='recording')rec.stop()},10000);message('Идёт запись…')}catch(e){message(e.message)}};
$('send').onclick=async()=>{$('send').disabled=true;$('retry').disabled=true;try{message('Отправляем видео…');const p=await new Promise((resolve,reject)=>{const f=new FileReader();f.onload=()=>resolve(f.result.split(',')[1]);f.onerror=reject;f.readAsDataURL(blob)});await rpc('cs_upload',{r:room,t:token,m:blob.type,p});clearPreview();show('preview',false);show('placeholder',true);$('placeholder').textContent='✓';show('send',false);show('retry',false);message('Видео отправлено! Посмотри на большой экран.')}catch(e){message('Не удалось отправить: '+(e.message||e));$('send').disabled=false;$('retry').disabled=false}};addEventListener('pagehide',release);check();
</script></body></html>
