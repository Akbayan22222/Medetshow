*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#42644a,#10291f 75%);color:#fff6df;font:16px system-ui;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:12px 3vw;gap:20px}h1{font-size:clamp(26px,4vw,62px);letter-spacing:.08em;margin:0;color:#ffd788}header p{margin:4px 0;color:#d6e6ca}#time{font-size:clamp(32px,5vw,76px);font-weight:900;font-variant-numeric:tabular-nums}#qr{background:white;padding:16px;border-radius:12px}#qr:empty{display:none}#qr img{display:block}main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;padding:0 3vw}.card{position:relative;border:2px solid #9ab28a;border-radius:20px;overflow:hidden;background:linear-gradient(#91c7b5,#d8e3b2 60%,#6a9b50 61%,#38693d);display:flex;flex-direction:column;min-height:0}.card.lead{border-color:#ffd367;box-shadow:0 0 22px #ffd36788}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#163b2de8;font-size:clamp(15px,2vw,30px);font-weight:800}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.liters{color:#ffdb85;white-space:nowrap}.scene{width:100%;height:100%;min-height:0;flex:1}.arm{transform-box:view-box;transform-origin:110px 101px}.stream{opacity:0}.active .arm{animation:milk var(--speed,.35s) infinite alternate ease-in-out}.active .stream{opacity:1;animation:flow .25s infinite linear}.active .drop{opacity:1;animation:drop .35s infinite}.active .tail{animation:tail .6s infinite alternate;transform-origin:292px 83px;transform-box:view-box}@keyframes milk{to{transform:rotate(12deg) translateY(3px)}}@keyframes flow{to{stroke-dashoffset:-15}}@keyframes drop{to{transform:translateY(10px);opacity:0}}@keyframes tail{to{transform:rotate(13deg)}}footer{display:flex;justify-content:space-between;align-items:center;padding:8px 3vw;gap:10px}button,input{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid #87a68c}button{background:#f5ce78;color:#21382b;font-weight:700;cursor:pointer}button:disabled{opacity:.4}dialog{background:#183a2b;color:#fff6df;border:1px solid #91b393;border-radius:18px;max-width:90vw}dialog::backdrop{background:#071b15bb}input{display:block;margin:10px 0;width:100%}#result{text-align:center;min-width:min(440px,85vw)}#winnerName{font-size:clamp(26px,5vw,60px);color:#ffdb85;overflow-wrap:anywhere}#ranking{white-space:pre-line;line-height:1.8}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}.paper{position:absolute;top:-20px;width:9px;height:15px;animation:fall 3s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}#status{color:#ffd788;font-size:14px} @media(max-height:650px){#qr{padding:8px}#qr img,#qr canvas{width:105px!important;height:105px!important}header{padding:5px 3vw}}

.card{background:#72ac75;border-color:#c3d7ae;border-radius:22px;box-shadow:0 8px 24px #071b1544}.top{background:linear-gradient(100deg,#173b2c,#28533d);padding:8px 18px}.scene{display:block;overflow:hidden}.arm{transform-origin:249px 160px}.active .tail{transform-origin:292px 113px}.active .arm{animation-name:milkPremium}@keyframes milkPremium{from{transform:translateY(-2px) rotate(-1deg)}to{transform:translateY(3px) rotate(2deg)}}.active .stream{animation-duration:var(--speed,.35s)}.card.lead{border-color:#ffdb85;box-shadow:0 0 24px #ffcf6688}.card.lead .top{background:linear-gradient(100deg,#69491e,#a47b2e)}
.arm{transform-origin:294px 163px}.arm-back{transform-origin:306px 169px}.active .arm-back{animation-direction:alternate-reverse}.scene{background:linear-gradient(#79c8ee,#e9f9d8 48%,#79b66b 49%,#398a52)}

.artScene{display:flex;align-items:center;justify-content:center;background:linear-gradient(100deg,#64974c,#80b265,#64974c);overflow:hidden}.artScene canvas{display:block;max-width:100%;max-height:100%;width:auto;height:100%;object-fit:contain;aspect-ratio:710/310}

#board .card[hidden],#waiting[hidden]{display:none!important}
#waiting{grid-column:1/-1;grid-row:1/-1;align-self:center;text-align:center;color:#fff6df;padding:24px}
#waiting h2{font-size:clamp(24px,4vw,56px);margin:0 0 12px;color:#ffdb85}#waiting p{font-size:clamp(16px,2vw,28px);color:#d6e6ca;margin:0}
#board[data-count="1"]{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#board[data-count="2"]{grid-template-rows:minmax(0,1fr)}
#board[data-count="3"]{grid-template-columns:repeat(4,minmax(0,1fr))}
#board[data-count="3"] .card{grid-column:span 2}
#board[data-count="3"] .card.last-visible{grid-column:2/span 2}

function drawFarm(c,t){
 const cv=c.el.querySelector('canvas'),ctx=cv.getContext('2d');if(!art.complete||!art.naturalWidth)return;
 const active=c.el.classList.contains('active');
 if(!active&&!c.wasActive&&c.drawn)return;
 c.drawn=true;c.wasActive=active;
 ctx.drawImage(art,0,0,710,310);
 if(!active)return;
 const speed=parseFloat(c.el.style.getPropertyValue('--speed'))||.35;
 const phase=t/(speed*1000)*Math.PI;
 const wave=Math.sin(phase)*7.5;
 // Local, continuous deformation: arm moves, the rest of the picture stays still.
 for(let x=215;x<415;x+=2){
  const u=(x-215)/200;const envelope=Math.pow(Math.sin(Math.PI*u),2);
  const center=165+Math.max(0,Math.min(1,(x-260)/100))*40;
  const top=130,bottom=234;const dy=wave*envelope;
  ctx.drawImage(art,x,top,2,center-top,x,top,2,center-top+dy);
  ctx.drawImage(art,x,center,2,bottom-center,x,center+dy,2,bottom-center-dy);
 }
 // Milk pulse and droplets, independently animated.
 const pulse=(Math.sin(phase)+1)/2;
 ctx.save();ctx.strokeStyle='rgba(255,255,246,'+(.35+.65*pulse)+')';ctx.lineWidth=2.5+1.3*pulse;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(373,217+wave*.45);ctx.quadraticCurveTo(373,230,376,246);ctx.stroke();
 ctx.fillStyle='rgba(255,255,246,.9)';for(let k=0;k<4;k++){const p=(t/450+k/4)%1;ctx.globalAlpha=1-p;ctx.beginPath();ctx.arc(377+(k%2?1:-1)*(5+p*10),247-Math.sin(p*Math.PI)*10,1.5-p*.5,0,Math.PI*2);ctx.fill();}ctx.restore();
}
function artLoop(t){for(const c of cards)if(!c.el.hidden)drawFarm(c,t);requestAnimationFrame(artLoop);}
let room=null,state=null,offset=0,busy=false,shown=false;const cards=[];const say=s=>$('status').textContent=s;for(let i=0;i<4;i++){const el=document.createElement('section');el.className='card';el.hidden=true;el.innerHTML='<div class="top"><span class="name"></span><span class="liters"></span></div>'+scene.replaceAll('@','-player-'+i); $('board').append(el);cards.push({el,score:0,at:0});}const fmt=n=>(n*.05).toFixed(2).replace('.',',')+' л';
function render(){const p=state?.players||[],start=state?.start?Date.parse(state.start):null,delta=start===null?null:(Date.now()+offset-start)/1000; $('count').textContent=p.length+' / 4';$('start').disabled=p.length<2||start!==null;$('board').dataset.count=String(p.length);$('waiting').hidden=p.length>0;$('waitingText').textContent=room?'Сканируйте QR-код и подключайтесь к игре.':'Ведущий скоро откроет игру.';$('time').textContent=delta===null?'01:00':delta<0?String(Math.ceil(-delta)): (delta<1?'01:00':'00:'+String(Math.max(0,Math.ceil(60-delta))).padStart(2,'0'));if(delta!==null&&delta>=0&&delta<1)$('time').textContent='СТАРТ!';const max=Math.max(0,...p.map(x=>x.score));cards.forEach((c,i)=>{const x=p.find(y=>y.slot===i+1),score=x?.score||0;c.el.hidden=!x;c.el.classList.toggle('last-visible',p.length===3&&!!x&&x.slot===p[p.length-1].slot);if(score>c.score){c.at=performance.now();c.el.style.setProperty('--speed',Math.max(.14,.5-(score-c.score)*.055)+'s')}c.score=score;c.el.querySelector('.name').textContent=x?.name||'Игрок '+(i+1)+' · ожидание';c.el.querySelector('.liters').textContent=fmt(score);c.el.classList.toggle('active',delta>=0&&delta<60&&performance.now()-c.at<1300&&score>0);c.el.classList.toggle('lead',score>0&&score===max);});if(delta!==null&&delta>=62.5&&!shown){shown=true;const rank=[...p].sort((a,b)=>b.score-a.score);const winners=rank.filter(x=>x.score===rank[0]?.score);$('winnerName').textContent=winners.map(x=>x.name).join(' / ');$('ranking').textContent=rank.map(x=>x.name+' — '+fmt(x.score)).join('\n');$('result').showModal();for(let i=0;i<70;i++){const e=document.createElement('i');e.className='paper';e.style.cssText=`left:${Math.random()*100}%;background:${['#ffd367','#fff','#86d6ad','#f58b72'][i%4]};--dx:${Math.random()*180-90}px;animation-delay:${Math.random()}s`; $('confetti').append(e);setTimeout(()=>e.remove(),4200)}}}
function setRoom(r){room=r;state=null;shown=false;cards.forEach(c=>{c.score=0;c.at=0});$('qr').replaceChildren();if(r){const u=new URL('join.html',location.href);u.searchParams.set('room',r);new QRCode($('qr'),{text:u.href,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}render()}
async function refresh(){if(!room||busy)return;busy=true;const r=room;try{const x=await rpc('sy_state',{r});if(r!==room)return;if(!x){setRoom(null);say('Комната закрыта');return}state=x;offset=Date.parse(x.now)-Date.now();say('');render()}catch(e){say(e.message)}finally{busy=false}}async function init(){try{setRoom(await rpc('sy_current'));if(!room)$('controls').showModal();refresh()}catch(e){say(e.message)}}$('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('error').textContent=error.message;return}$('login').close();init()};db.auth.getSession().then(({data})=>data.session?init():$('login').showModal());$('settings').onclick=()=>{if(!$('login').open&&!$('result').open&&!$('controls').open)$('controls').showModal()};addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();$('controls').open?$('controls').close():$('settings').click()}});$('close').onclick=()=>$('controls').close();$('full').onclick=()=>{document.documentElement.requestFullscreen?.().catch(e=>say(e.message));$('controls').close()};$('new').onclick=async()=>{if(room&&!confirm('Начать новую игру и удалить старую?'))return;try{setRoom(await rpc('sy_new'));$('controls').close();refresh()}catch(e){say(e.message)}};$('start').onclick=async()=>{try{await rpc('sy_start',{r:room});$('controls').close();refresh()}catch(e){say(e.message)}};$('end').onclick=async()=>{if(room&&confirm('Завершить игру?'))try{await rpc('sy_end',{r:room});setRoom(null);$('controls').close()}catch(e){say(e.message)}};$('back').onclick=()=>$('result').close();setInterval(refresh,650);setInterval(render,100);render();requestAnimationFrame(artLoop);
