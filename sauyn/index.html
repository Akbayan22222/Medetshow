<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>САУЫН SHOW</title><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#42644a,#10291f 75%);color:#fff6df;font:16px system-ui;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:12px 3vw;gap:20px}h1{font-size:clamp(26px,4vw,62px);letter-spacing:.08em;margin:0;color:#ffd788}header p{margin:4px 0;color:#d6e6ca}#time{font-size:clamp(32px,5vw,76px);font-weight:900;font-variant-numeric:tabular-nums}#qr{background:white;padding:16px;border-radius:12px}#qr:empty{display:none}#qr img{display:block}main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;padding:0 3vw}.card{position:relative;border:2px solid #9ab28a;border-radius:20px;overflow:hidden;background:linear-gradient(#91c7b5,#d8e3b2 60%,#6a9b50 61%,#38693d);display:flex;flex-direction:column;min-height:0}.card.lead{border-color:#ffd367;box-shadow:0 0 22px #ffd36788}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#163b2de8;font-size:clamp(15px,2vw,30px);font-weight:800}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.liters{color:#ffdb85;white-space:nowrap}.scene{width:100%;height:100%;min-height:0;flex:1}.arm{transform-box:view-box;transform-origin:110px 101px}.stream{opacity:0}.active .arm{animation:milk var(--speed,.35s) infinite alternate ease-in-out}.active .stream{opacity:1;animation:flow .25s infinite linear}.active .drop{opacity:1;animation:drop .35s infinite}.active .tail{animation:tail .6s infinite alternate;transform-origin:292px 83px;transform-box:view-box}@keyframes milk{to{transform:rotate(12deg) translateY(3px)}}@keyframes flow{to{stroke-dashoffset:-15}}@keyframes drop{to{transform:translateY(10px);opacity:0}}@keyframes tail{to{transform:rotate(13deg)}}footer{display:flex;justify-content:space-between;align-items:center;padding:8px 3vw;gap:10px}button,input{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid #87a68c}button{background:#f5ce78;color:#21382b;font-weight:700;cursor:pointer}button:disabled{opacity:.4}dialog{background:#183a2b;color:#fff6df;border:1px solid #91b393;border-radius:18px;max-width:90vw}dialog::backdrop{background:#071b15bb}input{display:block;margin:10px 0;width:100%}#result{text-align:center;min-width:min(440px,85vw)}#winnerName{font-size:clamp(26px,5vw,60px);color:#ffdb85;overflow-wrap:anywhere}#ranking{white-space:pre-line;line-height:1.8}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}.paper{position:absolute;top:-20px;width:9px;height:15px;animation:fall 3s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:0}}#status{color:#ffd788;font-size:14px} @media(max-height:650px){#qr{padding:8px}#qr img,#qr canvas{width:105px!important;height:105px!important}header{padding:5px 3vw}}

.card{background:#72ac75;border-color:#c3d7ae;border-radius:22px;box-shadow:0 8px 24px #071b1544}.top{background:linear-gradient(100deg,#173b2c,#28533d);padding:8px 18px}.scene{display:block;overflow:hidden}.arm{transform-origin:249px 160px}.active .tail{transform-origin:292px 113px}.active .arm{animation-name:milkPremium}@keyframes milkPremium{from{transform:translateY(-2px) rotate(-1deg)}to{transform:translateY(3px) rotate(2deg)}}.active .stream{animation-duration:var(--speed,.35s)}.card.lead{border-color:#ffdb85;box-shadow:0 0 24px #ffcf6688}.card.lead .top{background:linear-gradient(100deg,#69491e,#a47b2e)}

body{background:radial-gradient(ellipse at 50% 0%,#43583b,#15271d 65%,#091710);font-family:system-ui,sans-serif}header{position:relative;min-height:110px;padding:12px 2.5vw;gap:16px}header>div:first-child{order:1;flex:1;text-align:center}h1{font-size:clamp(24px,4vw,68px);letter-spacing:.04em;color:#ffe1a1;text-shadow:0 3px 0 #805321,0 7px 16px #000}header p{font-size:clamp(12px,1.2vw,19px);color:#e9d6b2}#time{order:0;background:linear-gradient(#80502b,#3e2819);border:2px solid #d7a760;border-radius:20px;padding:10px 20px;font-size:clamp(25px,4vw,65px);min-width:15vw;text-align:center;box-shadow:0 6px 18px #0006}#qr{order:2;padding:16px;border:3px solid #d4ac70;box-shadow:0 4px 20px #0006}main{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:14px;padding:0 2.5vw}.card{border:3px solid #c6a36a;border-radius:24px;background:#1c2c1c;box-shadow:0 9px 24px #0007}.top{position:relative;z-index:2;flex-direction:column;gap:4px;padding:9px 8px;background:linear-gradient(#3d4e29,#1b2918);border-bottom:2px solid #c6a36a;font-size:clamp(15px,1.8vw,32px)}.name{max-width:100%}.liters{font-size:clamp(24px,3.2vw,58px);font-weight:900;color:#ffe2a5}.scene{position:relative;isolation:isolate;background:#4b633a;overflow:hidden}.portrait{position:absolute;width:100%;height:100%;object-fit:contain;object-position:center;background:#344a2b;user-select:none}.effects{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}.milk-meter{position:absolute;right:9px;bottom:12px;width:14px;height:34%;border:2px solid #ffe3ae;border-radius:20px;background:#152519aa;overflow:hidden;box-shadow:0 2px 8px #0008}.milk-level{position:absolute;bottom:0;width:100%;height:0;background:linear-gradient(#fff,#e1cfa5);transition:height .3s}.live-label{position:absolute;bottom:12px;left:10px;background:#13291fdf;color:#ffe4a3;padding:6px 10px;border-radius:12px;font-size:clamp(10px,1vw,18px);font-weight:800;opacity:0;transition:opacity .2s}.active .live-label{opacity:1}.active .portrait{animation:photoPulse var(--speed,.35s) infinite alternate ease-in-out}@keyframes photoPulse{to{transform:scale(1.018)}}.card.lead{border-color:#ffda78;box-shadow:0 0 24px #ffca59aa}.card.lead .top{background:linear-gradient(#966127,#503118)}.card.lead .name::before{content:'★ ';color:#ffda78}footer{padding:8px 2.5vw}dialog{border-color:#d6ae72;background:#203326} @media(max-width:760px){main{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.top{flex-direction:row}header{min-height:0;gap:8px}#time{padding:6px}#qr{padding:8px}#qr img,#qr canvas{width:90px!important;height:90px!important}}
</style></head><body><header><div><h1>САУЫН SHOW</h1><p>Кто больше надоит?</p></div><div id="time">01:00</div><div id="qr"></div></header><main id="board"></main><footer><span id="count">0 / 4</span><span id="status"></span><button id="settings">⚙ F2</button></footer><dialog id="login"><h2>Вход ведущего</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="signin">Войти</button><p id="error"></p></dialog><dialog id="controls"><h2>Управление</h2><button id="new">Новая игра</button> <button id="start">Старт</button> <button id="end">Завершить</button> <button id="full">Полный экран</button> <button id="close">Закрыть</button><p>Старт после подключения четырёх гостей.</p></dialog><dialog id="result"><h2>★ ПОБЕДИТЕЛЬ ★</h2><div id="winnerName"></div><p id="ranking"></p><button id="back">Закрыть результаты</button></dialog><div id="confetti"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="config.js"></script><script>
const scene=`<div class="scene"><img class="portrait" alt="" draggable="false"><svg class="effects" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="stream" d="M48 68 Q48 75 47 83" stroke="white" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 2" fill="none"/><circle class="drop" cx="47" cy="81" r=".8" fill="white" opacity="0"/><path class="fill" d="M0 0" stroke-width="0"/><ellipse class="surface" rx="0" ry="0"/></svg><div class="milk-meter"><div class="milk-level"></div></div><span class="live-label">САУЫН!</span></div>`;
let room=null,state=null,offset=0,busy=false,shown=false;const cards=[];const say=s=>$('status').textContent=s;for(let i=0;i<4;i++){const el=document.createElement('section');el.className='card';el.innerHTML='<div class="top"><span class="name"></span><span class="liters"></span></div>'+scene.replaceAll('@','-player-'+i); el.querySelector('.portrait').src='assets/player-'+(i+1)+'.webp'; $('board').append(el);cards.push({el,score:0,at:0});}const fmt=n=>(n*.05).toFixed(2).replace('.',',')+' л';
function render(){const p=state?.players||[],start=state?.start?Date.parse(state.start):null,delta=start===null?null:(Date.now()+offset-start)/1000; $('count').textContent=p.length+' / 4';$('start').disabled=p.length!==4||start!==null;$('time').textContent=delta===null?'01:00':delta<0?String(Math.ceil(-delta)): (delta<1?'01:00':'00:'+String(Math.max(0,Math.ceil(60-delta))).padStart(2,'0'));if(delta!==null&&delta>=0&&delta<1)$('time').textContent='СТАРТ!';const max=Math.max(0,...p.map(x=>x.score));cards.forEach((c,i)=>{const x=p.find(y=>y.slot===i+1),score=x?.score||0;if(score>c.score){c.at=performance.now();c.el.style.setProperty('--speed',Math.max(.14,.5-(score-c.score)*.055)+'s')}c.score=score;c.el.querySelector('.name').textContent=x?.name||'Игрок '+(i+1)+' · ожидание';c.el.querySelector('.liters').textContent=fmt(score);c.el.classList.toggle('active',delta>=0&&delta<60&&performance.now()-c.at<1300&&score>0);c.el.classList.toggle('lead',score>0&&score===max);c.el.querySelector('.milk-level').style.height=Math.min(100,score/3)+'%';const f=c.el.querySelector('.fill');f.setAttribute('stroke-width',String(3+Math.min(17,score/15)));const surf=c.el.querySelector('.surface');surf.setAttribute('opacity',score>0?'1':'0');surf.setAttribute('cy',String(164-Math.min(22,score/12)));});if(delta!==null&&delta>=62.5&&!shown){shown=true;const rank=[...p].sort((a,b)=>b.score-a.score);const winners=rank.filter(x=>x.score===rank[0]?.score);$('winnerName').textContent=winners.map(x=>x.name).join(' / ');$('ranking').textContent=rank.map(x=>x.name+' — '+fmt(x.score)).join('\n');$('result').showModal();for(let i=0;i<70;i++){const e=document.createElement('i');e.className='paper';e.style.cssText=`left:${Math.random()*100}%;background:${['#ffd367','#fff','#86d6ad','#f58b72'][i%4]};--dx:${Math.random()*180-90}px;animation-delay:${Math.random()}s`; $('confetti').append(e);setTimeout(()=>e.remove(),4200)}}}
function setRoom(r){room=r;state=null;shown=false;cards.forEach(c=>{c.score=0;c.at=0});$('qr').replaceChildren();if(r){const u=new URL('join.html',location.href);u.searchParams.set('room',r);new QRCode($('qr'),{text:u.href,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}render()}
async function refresh(){if(!room||busy)return;busy=true;const r=room;try{const x=await rpc('sy_state',{r});if(r!==room)return;if(!x){setRoom(null);say('Комната закрыта');return}state=x;offset=Date.parse(x.now)-Date.now();say('');render()}catch(e){say(e.message)}finally{busy=false}}async function init(){try{setRoom(await rpc('sy_current'));if(!room)$('controls').showModal();refresh()}catch(e){say(e.message)}}$('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('error').textContent=error.message;return}$('login').close();init()};db.auth.getSession().then(({data})=>data.session?init():$('login').showModal());$('settings').onclick=()=>{if(!$('login').open&&!$('result').open&&!$('controls').open)$('controls').showModal()};addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();$('controls').open?$('controls').close():$('settings').click()}});$('close').onclick=()=>$('controls').close();$('full').onclick=()=>{document.documentElement.requestFullscreen?.().catch(e=>say(e.message));$('controls').close()};$('new').onclick=async()=>{if(room&&!confirm('Начать новую игру и удалить старую?'))return;try{setRoom(await rpc('sy_new'));$('controls').close();refresh()}catch(e){say(e.message)}};$('start').onclick=async()=>{try{await rpc('sy_start',{r:room});$('controls').close();refresh()}catch(e){say(e.message)}};$('end').onclick=async()=>{if(room&&confirm('Завершить игру?'))try{await rpc('sy_end',{r:room});setRoom(null);$('controls').close()}catch(e){say(e.message)}};$('back').onclick=()=>$('result').close();setInterval(refresh,650);setInterval(render,100);render();
</script></body></html>
