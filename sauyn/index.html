*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#42644a,#10291f 75%);color:#fff6df;font:16px system-ui;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:12px 3vw;gap:20px}h1{font-size:clamp(26px,4vw,62px);letter-spacing:.08em;margin:0;color:#ffd788}header p{margin:4px 0;color:#d6e6ca}#time{font-size:clamp(32px,5vw,76px);font-weight:900;font-variant-numeric:tabular-nums}#qr{background:white;padding:16px;border-radius:12px}#qr:empty{display:none}#qr img{display:block}main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;padding:0 3vw}.card{position:relative;border:2px solid #9ab28a;border-radius:20px;overflow:hidden;background:linear-gradient(#91c7b5,#d8e3b2 60%,#6a9b50 61%,#38693d);display:flex;flex-direction:column;min-height:0}.card.lead{border-color:#ffd367;box-shadow:0 0 22px #ffd36788}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#163b2de8;font-size:clamp(15px,2vw,30px);font-weight:800}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.liters{color:#ffdb85;white-space:nowrap}.scene{width:100%;height:100%;min-height:0;flex:1}.arm{transform-box:view-box;transform-origin:110px 101px}.stream{opacity:0}.active .arm{animation:milk var(--speed,.35s) infinite alternate ease-in-out}.active .stream{opacity:1;animation:flow .25s infinite linear}.active .drop{opacity:1;animation:drop .35s infinite}.active .tail{animation:tail .6s infinite alternate;transform-origin:292px 83px;transform-box:view-box}@keyframes milk{to{transform:rotate(12deg) translateY(3px)}}@keyframes flow{to{stroke-dashoffset:-15}}@keyframes drop{to{transform:translateY(10px);opacity:0}}@keyframes tail{to{transform:rotate(13deg)}}footer{display:flex;justify-content:space-between;align-items:center;padding:8px 3vw;gap:10px}button,input{font:in let room=null,state=null,offset=0,busy=false,shown=false;const cards=[];const say=s=>$('status').textContent=s;for(let i=0;i<4;i++){const el=document.createElement('section');el.className='card';el.innerHTML='<div class="top"><span class="name"></span><span class="liters"></span></div>'+scene.replaceAll('@','-player-'+i); $('board').append(el);cards.push({el,score:0,at:0});}const fmt=n=>(n*.05).toFixed(2).replace('.',',')+' л';
function render(){const p=state?.players||[],start=state?.start?Date.parse(state.start):null,delta=start===null?null:(Date.now()+offset-start)/1000; $('count').textContent=p.length+' / 4';$('start').disabled=p.length!==4||start!==null;$('time').textContent=delta===null?'01:00':delta<0?String(Math.ceil(-delta)): (delta<1?'01:00':'00:'+String(Math.max(0,Math.ceil(60-delta))).padStart(2,'0'));if(delta!==null&&delta>=0&&delta<1)$('time').textContent='СТАРТ!';const max=Math.max(0,...p.map(x=>x.score));cards.forEach((c,i)=>{const x=p.find(y=>y.slot===i+1),score=x?.score||0;if(score>c.score){c.at=performance.now();c.el.style.setProperty('--speed',Math.max(.14,.5-(score-c.score)*.055)+'s')}c.score=score;c.el.querySelector('.name').textContent=x?.name||'Игрок '+(i+1)+' · ожидание';c.el.querySelector('.liters').textContent=fmt(score);c.el.classList.toggle('active',delta>=0&&delta<60&&performance.now()-c.at<1300&&score>0);c.el.classList.toggle('lead',score>0&&score===max);const f=c.el.querySelector('.fill');f.setAttribute('stroke-width',String(3+Math.min(17,score/15)));const surf=c.el.querySelector('.surface');surf.setAttribute('opacity',score>0?'1':'0');surf.setAttribute('cy',String(164-Math.min(22,score/12)));});if(delta!==null&&delta>=62.5&&!shown){shown=true;const rank=[...p].sort((a,b)=>b.score-a.score);const winners=rank.filter(x=>x.score===rank[0]?.score);$('winnerName').textContent=winners.map(x=>x.name).join(' / ');$('ranking').textContent=rank.map(x=>x.name+' — '+fmt(x.score)).join('\n');$('result').showModal();for(let i=0;i<70;i++){const e=document.createElement('i');e.className='paper';e.style.cssText=`left:${Math.random()*100}%;background:${['#ffd367','#fff','#86d6ad','#f58b72'][i%4]};--dx:${Math.random()*180-90}px;animation-delay:${Math.random()}s`; $('confetti').append(e);setTimeout(()=>e.remove(),4200)}}}
function setRoom(r){room=r;state=null;shown=false;cards.forEach(c=>{c.score=0;c.at=0});$('qr').replaceChildren();if(r){const u=new URL('join.html',location.href);u.searchParams.set('room',r);new QRCode($('qr'),{text:u.href,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}render()}
async function refresh(){if(!room||busy)return;busy=true;const r=room;try{const x=await rpc('sy_state',{r});if(r!==room)return;if(!x){setRoom(null);say('Комната закрыта');return}state=x;offset=Date.parse(x.now)-Date.now();say('');render()}catch(e){say(e.message)}finally{busy=false}}async function init(){try{setRoom(await rpc('sy_current'));if(!room)$('controls').showModal();refresh()}catch(e){say(e.message)}}$('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('error').textContent=error.message;return}$('login').close();init()};db.auth.getSession().then(({data})=>data.session?init():$('login').showModal());$('settings').onclick=()=>{if(!$('login').open&&!$('result').open&&!$('controls').open)$('controls').showModal()};addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();$('controls').open?$('controls').close():$('settings').click()}});$('close').onclick=()=>$('controls').close();$('full').onclick=()=>{document.documentElement.requestFullscreen?.().catch(e=>say(e.message));$('controls').close()};$('new').onclick=async()=>{if(room&&!confirm('Начать новую игру и удалить старую?'))return;try{setRoom(await rpc('sy_new'));$('controls').close();refresh()}catch(e){say(e.message)}};$('start').onclick=async()=>{try{await rpc('sy_start',{r:room});$('controls').close();refresh()}catch(e){say(e.message)}};$('end').onclick=async()=>{if(room&&confirm('Завершить игру?'))try{await rpc('sy_end',{r:room});setRoom(null);$('controls').close()}catch(e){say(e.message)}};$('back').onclick=()=>$('result').close();setInterval(refresh,650);setInterval(render,100);render();
</script></body></html>
