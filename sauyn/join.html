<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>САУЫН SHOW • Игрок</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#42644a,#10291f 80%);color:#fff6df;font:16px system-ui}main{width:min(100%,440px);padding:24px;text-align:center}h1{color:#ffda87;letter-spacing:.08em}input,button{width:100%;font:inherit;padding:15px;border-radius:12px;border:1px solid #87a68c;margin:7px 0}button{background:#ffda87;color:#20372a;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#score{font-size:56px;font-weight:900;color:#ffda87;font-variant-numeric:tabular-nums}#clock{font-size:32px;font-weight:800}.phone{width:120px;height:175px;margin:26px auto;border:5px solid #ffda87;border-radius:20px;background:#294c36;display:grid;place-items:center;font-size:48px}.moving{animation:move .4s alternate infinite ease-in-out}@keyframes move{to{transform:translateY(-12px)}}p{line-height:1.5;color:#dae7d0}[hidden]{display:none!important}</style></head><body><main><h1>САУЫН SHOW</h1><section id="entry"><h2>Кто больше надоит?</h2><input id="name" maxlength="24" placeholder="Твоё имя" autocomplete="off"><button id="join" disabled>Подключиться</button></section><section id="game" hidden><h2 id="player"></h2><div id="clock">01:00</div><div class="phone" id="phone">🥛</div><div id="score">0,00 л</div><p id="hint">Ожидаем старт ведущего</p><button id="permission" hidden>Разрешить датчики движения</button><button id="tap" hidden>Нажимай в ритме</button><p>Держи телефон крепко. Двигай плавно вверх и вниз, без резких взмахов.</p></section><p id="message" role="status">Проверяем комнату…</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const room=new URLSearchParams(location.search).get('room');const msg=s=>$('message').textContent=s;let token,slot,state,offset=0,score=0,confirmed=0,joined=false,sending=false,polling=false,enabled=false,seen=false,lastSample=0,lastHit=0,lastDirection=0,lastPeak=0,baseline=null,finish=false;const key='sauyn-player:'+room;try{token=sessionStorage.getItem(key);if(!token){token=crypto.randomUUID();sessionStorage.setItem(key,token)}}catch(e){msg('Не удалось создать сессию. Откройте сайт через HTTPS.')}const fmt=n=>(n*.05).toFixed(2).replace('.',',')+' л';function elapsed(){return state?.start?(Date.now()+offset-Date.parse(state.start))/1000:null}function playing(){let t=elapsed();return joined&&t!==null&&t>=0&&t<60}function hit(){if(!playing()||performance.now()-lastHit<220)return;lastHit=performance.now();score++;$('score').textContent=fmt(score);$('phone').classList.add('moving')}
function motion(e){const a=e.acceleration;let y=a?.y;if(!Number.isFinite(y)){const g=e.accelerationIncludingGravity?.y;if(!Number.isFinite(g))return;if(baseline===null)baseline=g;baseline=.88*baseline+.12*g;y=g-baseline}seen=true;lastSample=performance.now();if(!playing())return;let d=y>2.5?1:y< -2.5?-1:0;if(d&&d!==lastDirection){const now=performance.now();if(lastDirection&&now-lastPeak<900&&now-lastPeak>90)hit();lastDirection=d;lastPeak=now}}
async function enable(){try{if(!window.DeviceMotionEvent)throw Error('Датчики недоступны');if(typeof DeviceMotionEvent.requestPermission==='function'&&await DeviceMotionEvent.requestPermission()!=='granted')throw Error('Нет разрешения');if(!enabled){window.addEventListener('devicemotion',motion);enabled=true} $('permission').hidden=true;$('tap').hidden=true;msg('Датчики включены. Сделайте плавное движение для проверки.');setTimeout(()=>{if(!seen){$('tap').hidden=false;$('permission').hidden=false;msg('Датчик не отвечает. Можно использовать кнопку.')}},3500)}catch(e){$('tap').hidden=false;$('permission').hidden=false;msg('Датчик недоступен. Используйте кнопку.')}}
$('permission').onclick=enable;$('tap').onclick=hit;async function refresh(){if(!room||polling)return;polling=true;try{const x=await rpc('sy_state',{r:room});if(!x){$('join').disabled=true;msg('Комната закрыта или QR-код устарел.');state=null;return}state=x;offset=Date.parse(x.now)-Date.now();$('join').disabled=joined||!!x.start||x.players.length>=4;if(!joined)msg(x.start?'Игра уже началась':x.players.length>=4?'Все места заняты':'Введите имя и подключитесь.');else{const p=x.players.find(p=>p.slot===slot);if(p){confirmed=p.score;score=Math.max(score,confirmed);$('score').textContent=fmt(score)}}}catch(e){msg('Ошибка связи: '+e.message)}finally{polling=false}}
async function send(){const t=elapsed();if(!joined||sending||score<=confirmed||t===null||t<0||t>61.8)return;sending=true;try{confirmed=await rpc('sy_score',{r:room,t:token,v:score})}catch(e){msg('Ошибка отправки: '+e.message)}finally{sending=false}}
$('join').onclick=async()=>{const n=$('name').value.trim();if(!n||!token)return;$('join').disabled=true;try{slot=await rpc('sy_join',{r:room,t:token,n});joined=true;$('entry').hidden=true;$('game').hidden=false;$('player').textContent=n;$('permission').hidden=false;msg('Вы подключены. Разрешите датчики движения.');refresh()}catch(e){msg(e.message);$('join').disabled=false}};function render(){if(!joined)return;let t=elapsed();$('clock').textContent=t===null?'01:00':t<0?String(Math.ceil(-t)):t<60?(t<1?'01:00':'00:'+String(Math.ceil(60-t)).padStart(2,'0')):'00:00';$('hint').textContent=t===null?'Ожидаем старт ведущего':t<0?'Приготовься!':t<60?'Двигай телефон вверх и вниз!':'Раунд завершён! Смотри на большой экран.';$('tap').disabled=!playing();if(performance.now()-lastHit>450||!playing())$('phone').classList.remove('moving');if(t!==null&&t>=62&&!finish){finish=true;score=confirmed;$('score').textContent=fmt(confirmed);msg('Результат: '+fmt(confirmed));}}if(!room)msg('Отсканируйте QR-код на большом экране.');else refresh();setInterval(refresh,750);setInterval(send,350);setInterval(render,100);
</script></body></html>
